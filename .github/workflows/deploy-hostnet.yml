name: Publish to Hostnet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostnet-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/deploy_hostnet.py --check
  deploy:
    needs: validate
    if: vars.HOSTNET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://hesseldevries.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y python3-paramiko
      - name: Back up and publish changed files
        run: /usr/bin/python3 scripts/deploy_hostnet.py
        env:
          HOSTNET_HOST: ssh.cyz0ptrz6.service.one
          HOSTNET_USER: cyz0ptrz6_u
          HOSTNET_WEBROOT: ${{ vars.HOSTNET_WEBROOT }}
          HOSTNET_SSH_KEY: ${{ secrets.HOSTNET_SSH_KEY }}
          HOSTNET_KNOWN_HOSTS: ${{ secrets.HOSTNET_KNOWN_HOSTS }}
