name: Validate website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate complete static publish set
        run: python3 scripts/deploy_hostnet.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live Meals diary behavior
        run: |
          npm install --no-save --no-audit --no-fund jsdom@24.1.3
          node tests/meals-smoke.cjs
      - name: Check cache isolation between apps
        run: node --test tests/service-worker.test.cjs
