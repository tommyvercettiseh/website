<main class="app">
 <header class="topline">
  <div class="mini-brand" aria-label="Stick to the Plan"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 38C10 30 7 16 9 7c8 1 15 5 19 12 2-7 8-12 15-14 3 14-5 28-19 33Z" fill="#2d8252"/><path d="M24 38c0-12 0-21 4-29" stroke="#dff4e4" stroke-width="2.4" stroke-linecap="round"/></svg><span>STICK TO <span>THE PLAN</span></span></div>
  <div class="top-actions"><button class="ghost" id="exportBtn">Export</button><button class="ghost" id="importBtn">Import</button><button class="ghost" id="todayBtn">Vandaag</button><input id="importFile" type="file" accept="application/json" hidden></div>
 </header>
 <section class="hero" aria-label="Voortgang vandaag">
  <div class="hero-brand"><div class="hero-logo"><svg viewBox="0 0 72 72" aria-hidden="true"><path d="M36 59C15 47 10 25 13 10c13 2 25 8 31 19 3-11 12-19 24-22 4 22-7 44-32 52Z" fill="#25764c"/><path d="M36 59c0-18 1-31 8-46" stroke="#e7f7e9" stroke-width="3" stroke-linecap="round"/></svg><h1>STICK TO <span>THE PLAN</span></h1></div><p class="hero-sub">Gezonde keuzes, grotere resultaten</p></div>
  <div class="rings" id="rings"></div>
 </section>

</main>

function stopCamera(){try{scanControls?.stop()}catch{}scanControls=null;for(const t of scanStream?.getTracks?.()||[])t.stop();scanStream=null;$('scanVideo').srcObject=null}
function loadZXing(){if(window.ZXingBrowser)return Promise.resolve();if(zxingPromise)return zxingPromise;zxingPromise=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';s.crossOrigin='anonymous';s.onload=res;s.onerror=rej;document.head.append(s)});return zxingPromise}
async function barcodeFound(code){code=String(code||'').replace(/\D/g,'');if(!/^\d{8,14}$/.test(code))return;stopCamera();closeDialog('scanDialog');openFood(activeKind);$('foodSearch').value=code;foodTab='search';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='search'));await searchOFF(code);haptic(15);toast('Barcode gevonden')}
async function openScan(kind){activeKind=kind;ensureEntry(kind);openDialog('scanDialog');$('scanStatus').textContent='Camera voorbereiden…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera niet beschikbaar');if('BarcodeDetector'in window){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','itf']});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('scanVideo').srcObject=scanStream;await $('scanVideo').play();$('scanStatus').textContent='Richt de camera op de barcode.';const loop=async()=>{if(!$('scanDialog').open)return;try{const codes=await det.detect($('scanVideo'));if(codes[0]?.rawValue)return barcodeFound(codes[0].rawValue)}catch{}requestAnimationFrame(loop)};loop();return}await loadZXing();const reader=new ZXingBrowser.BrowserMultiFormatReader();scanControls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},$('scanVideo'),res=>res&&barcodeFound(res.getText()));$('scanStatus').textContent='Richt de camera op de barcode.'}catch(e){$('scanStatus').textContent='Camera niet beschikbaar. Gebruik handmatige invoer.'}}
$('scanDialog').addEventListener('close',stopCamera);$('scanManual').onclick=()=>{const code=prompt('Barcode:');if(code)barcodeFound(code)};
$('prevWeek').onclick=()=>{const d=dateFrom(selectedDate);d.setDate(d.getDate()-7);selectedDate=dateId(d);haptic(6);render()};$('nextWeek').onclick=()=>{const d=dateFrom(selectedDate);d.setDate(d.getDate()+7);selectedDate=dateId(d);haptic(6);render()};$('todayBtn').onclick=()=>{selectedDate=dateId(nowDate());activeKind=currentSuggestedKind();render()};
function download(name,text){const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportBtn').onclick=()=>download('stick-to-the-plan-'+selectedDate+'.json',JSON.stringify({app:'hes-fuel-diary',schema_version:4,exported_at:new Date().toISOString(),data:state},null,2));$('importBtn').onclick=()=>{$('importFile').value='';$('importFile').click()};$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>2e6)throw Error('Bestand te groot');const d=JSON.parse(await f.text());if(d?.app!=='hes-fuel-diary'||!d.data?.days)throw Error('Onbekend formaat');if(!confirm('Import vervangt je huidige dagboek. Doorgaan?'))return;state={...blankState(),...d.data,goals:{...GOALS,...d.data.goals},prefs:{...PREFS,...d.data.prefs}};save();render();toast('Import voltooid')}catch(err){alert('Import mislukt: '+err.message)}finally{e.target.value=''}};
render();
</script>
