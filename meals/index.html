function saveRecipe(){let m=slotMeal(activeSlot);if(!m?.items.length)return toast('Voeg eerst ingrediënten toe');let existing=state.templates.find(x=>x.name?.toLocaleLowerCase('nl')===m.title.toLocaleLowerCase('nl'));let recipe={id:existing?.id||uid(),name:m.title,items:m.items.map(x=>({...x}))};if(existing)Object.assign(existing,recipe);else state.templates.push(recipe);save();haptic(12);toast('Recept opgeslagen ✓')}
function download(name,text){let u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('exportBtn').onclick=()=>download('stick-to-the-plan-'+TODAY+'.json',JSON.stringify({app:'hes-fuel-diary',schema_version:3,data:state},null,2));$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j?.app!=='hes-fuel-diary'||!j.data?.days)throw Error();if(confirm('Huidig dagboek vervangen door deze import?')){state=j.data;state.goals={...GOALS,...state.goals};state.prefs={...PREFS,...state.prefs};save();pickInitial();render();toast('Dagboek geïmporteerd')}}catch{toast('Import mislukt')}e.target.value=''};$('todayBtn').onclick=()=>{selectedDate=TODAY;pickInitial();render()};$('prevDay').onclick=()=>{selectedDate=shift(selectedDate,-1);pickInitial();render();haptic(6)};$('nextDay').onclick=()=>{selectedDate=shift(selectedDate,1);pickInitial();render();haptic(6)};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());for(const d of document.querySelectorAll('dialog'))d.onclick=e=>{if(e.target===d)d.close()};
pickInitial();render();
</script>
